<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Garima Aishwarya. Computer Science at UPES, minor in Aerospace.">
<style>
  .name { font: 700 60px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; }
  .sub  { font: 400 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
  .mono { font: 500 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #22d3ee; letter-spacing: 2px; }
  .edges line { stroke: #1e3a4a; stroke-width: 1; opacity: .7; }
  .n { fill: #0f172a; stroke: #22d3ee; stroke-width: 2; animation: lit 4s ease-in-out infinite; }
  .l1 { animation-delay: .5s; } .l2 { animation-delay: 1s; } .l3 { animation-delay: 1.5s; }
  @keyframes lit { 0%, 30%, 100% { fill: #0f172a; } 12% { fill: #22d3ee; } }
  .orbit { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4 6; opacity: .7; }
  .sat rect { fill: #22d3ee; fill-opacity: .35; stroke: #22d3ee; stroke-width: 1.5; }
  .sat .body { fill: #0f172a; fill-opacity: 1; }
  .sat line { stroke: #22d3ee; stroke-width: 1.5; }
  .planet { fill: #115e59; stroke: #22d3ee; stroke-width: 2; }
  .ring { fill: none; stroke: #22d3ee; stroke-width: 2; }
  .star { fill: #22d3ee; animation: twinkle 3s ease-in-out infinite; }
  .s1 { animation-delay: 1s; } .s2 { animation-delay: 2s; }
  @keyframes twinkle { 50% { opacity: .2; } }
  .cursor { fill: #22d3ee; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .n, .star, .cursor { animation: none; } }
</style>
<rect width="1200" height="300" rx="18" fill="#0b1220"/>
<text class="mono" x="64" y="92">HI, I'M</text>
<text class="name" x="64" y="158">Garima Aishwarya</text>
<text class="sub" x="64" y="200">Computer Science @ UPES · Minor in Aerospace</text>
<text class="mono" x="64" y="242">build it, then be able to explain it</text>
